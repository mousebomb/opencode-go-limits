<style>

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);

    margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  .nav a {
    font-size: 12px; color: var(--muted); text-decoration: none;

  }
  .nav a:hover { border-color: var(--muted); color: var(--text); }

<script>
// ========== 多语言（轻量 i18n：自动检测 + 手动切换，localStorage 记忆） ==========
const DICT = {
  zh: {
    'page.title': 'OpenCode Go · 每月预估请求数',
    'nav.opencode': 'OpenCode Go 用量',
    'nav.goat': 'Command Code GOAT 用量',
    'btn.refresh': '立即刷新',
    'meta.fetching': '正在获取最新数据…',
    'meta.wait': '等待在线数据…',
    'meta.ok': '数据抓取于 {time} · 共 {n} 个价格档位 · 来源：opencode.ai 官方文档',
    'meta.cache': '正在使用本地缓存（抓取于 {time}），并尝试在线更新…',
    'meta.fallback': '在线抓取失败，当前显示本地缓存。{msg}',

    'head.model': '模型',
    'head.requests': '每月请求数（估算）',
    'head.count': '数量',
    'detail.summary': '查看原始数据明细（单价 / 额度 / 估算过程）',
    'dt.model': '模型', 'dt.quota': '额度', 'dt.in': '输入$/M', 'dt.out': '输出$/M',
    'dt.cr': '缓存读$/M', 'dt.cw': '缓存写$/M', 'dt.cost': '每请求成本$',
    'dt.est': '估算月请求', 'dt.off': '官方月请求', 'dt.diff': '偏差',
    'tip.est': '每月请求数（估算）',
    'tip.est.na': '官方未提供请求模式，无法估算',
    'tip.off': '官方对照值',
    'tip.quota': '每月使用额度',
    'tip.cost': '每请求成本',
    'tip.diffLabel': '差异提示',
    'tip.diff': '▲ 与官方值偏差 {pct}%',
    'tip.pat': '请求模式',
    'tip.pat.v': '{a} 输入 / {b} 缓存 / {c} 输出',
    'tip.price': '单价',
    'tip.p.line1': '输入 {i} · 输出 {o}',
    'tip.p.line2': '缓存读 {c} · 缓存写 {w}',
    'flag.dev': '计算值与官方值差异较大',
    'gh.star': '去 GitHub 点亮 Star',
    'footer.line1': '数据源：<a href="https://opencode.ai/docs/zh-cn/go/#usage-limits" target="_blank" rel="noopener">opencode.ai 官方文档</a>（GitHub <code>anomalyco/opencode</code> 同步）。',
    'footer.line2': '打开页面即自动抓取最新数据；抓取失败时回退到本地缓存。',
  },
  en: {
    'page.title': 'OpenCode Go · Estimated requests / month',
    'nav.opencode': 'OpenCode Go usage',
    'nav.goat': 'Command Code GOAT usage',
    'btn.refresh': 'Refresh',
    'meta.fetching': 'Fetching latest data…',
    'meta.wait': 'Waiting for online data…',
    'meta.ok': 'Data fetched {time} · {n} pricing tiers · source: opencode.ai official docs',
    'meta.cache': 'Showing cached data (fetched {time}) while updating…',
    'meta.fallback': 'Online fetch failed; showing cached data. {msg}',
    'err.fetch': 'Fetch failed: {msg}. Try “Refresh” or check your network.',
    'head.model': 'Model',
    'head.requests': 'Requests / month (est.)',
    'head.count': 'Count',
    'detail.summary': 'Raw data detail (price / quota / calculation)',
    'dt.model': 'Model', 'dt.quota': 'Quota', 'dt.in': 'Input $/M', 'dt.out': 'Output $/M',
    'dt.cr': 'Cache read $/M', 'dt.cw': 'Cache write $/M', 'dt.cost': 'Cost/req $',
    'dt.est': 'Est. monthly', 'dt.off': 'Official monthly', 'dt.diff': 'Diff',
    'tip.est': 'Est. requests / month',
    'tip.est.na': 'No request pattern available to estimate',
    'tip.off': 'Official value',
    'tip.quota': 'Monthly quota',
    'tip.cost': 'Cost per request',
    'tip.diffLabel': 'Deviation',
    'tip.diff': '▲ {pct}% off official',
    'tip.pat': 'Request pattern',
    'tip.pat.v': '{a} input / {b} cached / {c} output',
    'tip.price': 'Unit price',
    'tip.p.line1': 'Input {i} · Output {o}',
    'tip.p.line2': 'Cache read {c} · Cache write {w}',
    'flag.dev': 'Large deviation from the official estimate',
    'gh.star': 'Star on GitHub',
    'footer.line1': 'Source: <a href="https://opencode.ai/docs/zh-cn/go/#usage-limits" target="_blank" rel="noopener">opencode.ai official docs</a> (mirrored from GitHub <code>anomalyco/opencode</code>).',
    'footer.line2': 'Data is fetched automatically on load; falls back to the last successful cache if fetching fails.',
  },
};
// 语言：localStorage 优先，其次检测系统语言（zh 开头 → 中文，否则英文）
let LANG = (localStorage.getItem('ocgl-lang') || '').toLowerCase();
if (!DICT[LANG]) LANG = ((navigator.language || '').toLowerCase().indexOf('zh') === 0) ? 'zh' : 'en';

// t(key[, params])：取当前语言文案，替换 {xxx} 占位符；缺失回退 en → zh → key 本身
const t = (key, p) => {
  let s = DICT[LANG][key] ?? DICT.en[key] ?? DICT.zh[key] ?? key;
  if (p) for (const k in p) s = s.split('{' + k + '}').join(String(p[k]));
  return s;
};
const langLocale = () => (LANG === 'zh' ? 'zh-CN' : 'en-US');
// 时间本地化格式
const fmtDate = (iso) => new Date(iso).toLocaleString(langLocale(), { hour12: false });

// ========== 常量与工具 ==========
const SOURCES = [
  'https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/web/src/content/docs/zh-cn/go.mdx',
  'https://cdn.jsdelivr.net/gh/anomalyco/opencode@dev/packages/web/src/content/docs/zh-cn/go.mdx',
];
const CACHE_KEY = 'opencode-go-limits-v1';
const $ = (sel) => document.querySelector(sel);

// 去掉千分位并转数字
const num = (s) => parseFloat(String(s).replace(/,/g, ''));
// 金额字符串（如 "$2.00" / "-"）转数字，'-' 返回 null
const money = (s) => (s === '-' || s == null ? null : parseFloat(s.replace('$', '')));
// 模型名归一化：小写 + 去掉空格/连字符，用于模糊匹配
const norm = (s) => s.toLowerCase().replace(/[\s\-_]+/g, '');
// 千分位格式
const fmt = (n) => Number(n).toLocaleString('en-US');
// 缩写格式：100 → 100，1,000 → 1k，1,000,000 → 1M
const fmtShort = (n) => (n >= 1e6 ? (n / 1e6) + 'M' : n >= 1e3 ? (n / 1e3) + 'k' : String(n));

// ========== 语言应用 ==========
let lastData = null;   // 最近一次成功渲染的数据（用于切语言后重绘）
let metaSt = null;     // 最近一次 meta 状态 { key, params }，用于切语言后重放

// 渲染当前语言的 meta 文本
function paintMeta() {
  if (!metaSt) return;
  const p = Object.assign({}, metaSt.params);
  if (p.time) p.time = fmtDate(p.time);
  $('#meta').textContent = t(metaSt.key, p);
}
function setMeta(key, params) { metaSt = { key, params }; paintMeta(); }

// 应用当前语言：静态文案 / 动态表 + tooltip / meta / 切换按钮高亮
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t('page.title');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === LANG));
  if (lastData) render(lastData); // 重建动态表格与 tooltip 文案
  paintMeta();
}

// ========== 抓取 ==========
async function fetchMdx() {
  let lastErr;
  for (const url of SOURCES) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

// ========== mdx 解析 ==========
// 取锚点之后的子串
function section(src, anchor) {
  const i = src.indexOf(anchor);
  return i < 0 ? null : src.slice(i + anchor.length);
}

// 解析锚点后的第一个 markdown 表格，返回去除表头的数据行二维数组
function parseTable(src, anchor) {
  const seg = section(src, anchor);
  if (!seg) return [];
  const rows = [];
  let started = false;
  for (const line of seg.split('\n')) {
    const t = line.trim();
    if (!t.startsWith('|')) { if (started) break; continue; }
    if (/^\|[\s:|-]+\|?$/.test(t)) continue; // 分隔行（| --- |）
    started = true;
    rows.push(t.split('|').slice(1, -1).map((c) => c.trim()));
  }
  return rows.slice(1); // 去掉表头行
}

// 解析"预估值采用以下每次请求的 token 数量"列表，返回 [{ expr, in, cache, out }]
function parsePatterns(src) {
  const seg = section(src, '预估值采用以下每次请求的 token 数量；');
  if (!seg) return [];
  const end = seg.indexOf('预估值还基于以下每 1M tokens 的价格');
  const body = end >= 0 ? seg.slice(0, end) : seg;
  const re = /^- (.+?) — 每次请求 ([0-9,]+) 个输入 token，([0-9,]+) 个缓存 token，([0-9,]+) 个输出 token$/gm;
  const out = [];
  let m;
  while ((m = re.exec(body))) {
    out.push({
      expr: m[1],
      in: num(m[2]), cache: num(m[3]), out: num(m[4]),
    });
  }
  return out;
}

// 在模式匹配表中查找"最具体的匹配"：模式名是基准名的前缀，取最长
// （如 "Kimi K2.7 Code" 匹配 "Kimi K2.7"）；若基准名反为模式的子串
// 则取最短（如 "MiMo V2.5 Pro" 不误配 "MiMo V2.5"）
function findPattern(patMap, baseNorm) {
  let best = null, bestLen = 0, prefixFallback = null, fallbackLen = Infinity;
  for (const [key, p] of patMap) {
    if (baseNorm.startsWith(key) && key.length > bestLen) { best = p; bestLen = key.length; }
    else if (key.startsWith(baseNorm) && key.length < fallbackLen) { prefixFallback = p; fallbackLen = key.length; }
  }
  return best || prefixFallback;
}

// 展开合并写法的模型名，如 "GLM-5.3/5.2/5.1" → ["GLM-5.3","GLM-5.2","GLM-5.1"]
function expandModelExpr(expr) {
  const parts = expr.split('/').map((s) => s.trim()).filter(Boolean);
  if (parts.length === 1) return parts;
  const head = parts[0];
  const names = [head];
  for (let i = 1; i < parts.length; i++) {
    const rest = parts[i];
    // 规则1：rest 首词若出现在 head 中，取其之前的部分作前缀（如 "DeepSeek V4 Flash / V4 Flash Vision Exp"）
    const firstWord = rest.split(/[\s-]+/)[0];
    const idx = head.indexOf(firstWord);
    let prefix;
    if (idx > 0) {
      prefix = head.slice(0, idx);
    } else {
      // 规则2：去掉 head 最后一个"段"（如 "GLM-5.3" → "GLM-"）
      const m = head.match(/^(.*[\s-])[^\s-]+$/);
      prefix = m ? m[1] : head;
    }
    names.push(prefix + rest);
  }
  return names;
}

// ========== 数据组装 ==========
// 解析全部原始数据，返回 { time, items }
function parse(mdx) {
  const prices = parseTable(mdx, '预估值还基于以下每 1M tokens 的价格以及每个模型包含的每月使用额度：');
  const patterns = parsePatterns(mdx);
  const official = parseTable(mdx, '下表提供了基于典型 Go 使用模式的预估请求数：');

  // 请求模式匹配表：归一化模型名 → token 构成
  const patMap = new Map();
  for (const p of patterns) {
    for (const name of expandModelExpr(p.expr)) patMap.set(norm(name), p);
  }
  // 官方每月请求数对照表：归一化模型名 → 数字（取第 4 列）
  const offMap = new Map();
  for (const row of official) offMap.set(norm(row[0]), num(row[3]));

  // 组装每个价格行条目
  const items = prices.map((row) => {
    const name = row[0];
    const base = name.replace(/\s*\(.*?\)\s*$/, '').trim(); // 去掉括号档位标注
    const price = {
      in: money(row[1]), out: money(row[2]), cr: money(row[3]), cw: money(row[4]),
    };
    const quota = money(row[5]);
    const pat = findPattern(patMap, norm(base));
    let monthly = null;
    let cost = null;
    if (pat && price.in != null && price.out != null && price.cr != null) {
      // 每次请求成本 = (输入×单价 + 缓存×缓存价 + 输出×输出价) / 1M
      cost = (pat.in * price.in + pat.cache * price.cr + pat.out * price.out) / 1e6;
      monthly = cost > 0 ? quota / cost : null;
    }
    const officialMonthly = offMap.get(norm(base)) ?? null;
    const diff = (monthly != null && officialMonthly) ? (monthly - officialMonthly) / officialMonthly : null;
    return { name, base, price, quota, pat, cost, monthly, officialMonthly, diff };
  });
  return { time: new Date().toISOString(), items };
}

// ========== 渲染 ==========
function render(data) {
  lastData = data;
  const { items } = data;
  const valids = items.filter((i) => i.monthly != null).sort((a, b) => a.monthly - b.monthly);
  const invalids = items.filter((i) => i.monthly == null);
  const ordered = [...valids, ...invalids];

  // 对数刻度范围（避免线性刻度下小值不可见）
  const lo = valids.length ? Math.log10(Math.min(...valids.map((i) => i.monthly))) : 0;
  const hi = valids.length ? Math.log10(Math.max(...valids.map((i) => i.monthly))) : 1;
  const span = hi - lo || 1;
  const x = (v) => Math.max(0, Math.min(100, ((Math.log10(v) - lo) / span) * 100));

  const rows = $('#rows');
  rows.innerHTML = '';
  for (const it of ordered) {
    const row = document.createElement('div');
    row.className = 'row';
    const flag = it.diff != null && Math.abs(it.diff) > 0.1
      ? '<span class="flag" title="' + t('flag.dev') + '">▲</span>' : '';
    row.innerHTML =
      '<div class="row-name">' + esc(it.name) + flag + '</div>' +
      '<div class="track"><div class="bar' + (it.monthly == null ? ' na' : '') + '" style="width:' + (it.monthly == null ? 0 : x(it.monthly)) + '%"></div></div>' +
      '<div class="row-value">' + (it.monthly != null ? fmt(Math.round(it.monthly)) : 'N/A') + '</div>';
    bindTip(row, it);
    rows.appendChild(row);
  }

  // 刻度轴
  const axis = $('#axis');
  axis.innerHTML = '';
  const loK = Math.floor(lo), hiK = Math.ceil(hi);
  for (let k = loK; k <= hiK; k++) {
    const pos = ((k - lo) / span) * 100;
    if (pos < 0 || pos > 100) continue;
    const g = document.createElement('div');
    g.className = 'grid-line';
    g.style.left = pos + '%';
    g.style.background = 'none';
    g.style.borderLeft = '1px solid var(--border)';
    axis.appendChild(g);
    const label = document.createElement('span');
    label.className = 'grid-label';
    label.style.left = pos + '%';
    label.textContent = fmtShort(10 ** k);
    axis.appendChild(label);
  }

  renderDetailTable(items);
}

// tooltip：悬停显示单价/额度/估算明细
function bindTip(row, it) {
  row.addEventListener('mousemove', (e) => {
    const tip = $('#tip');
    const lines = [
      [t('tip.est'), it.monthly != null ? fmt(Math.round(it.monthly)) : t('tip.est.na')],
      [t('tip.off'), it.officialMonthly != null ? fmt(it.officialMonthly) : '—'],
      [t('tip.quota'), it.quota != null ? '$' + it.quota : '—'],
      [t('tip.cost'), it.cost != null ? '$' + it.cost.toFixed(6) : '—'],
    ];
    if (it.diff != null && Math.abs(it.diff) > 0.1) {
      lines.push([t('tip.diffLabel'), t('tip.diff', { pct: (it.diff * 100).toFixed(1) }), true]);
    }
    if (it.pat) lines.push([t('tip.pat'), t('tip.pat.v', { a: it.pat.in, b: it.pat.cache, c: it.pat.out })]);
    lines.push(
      [t('tip.price'), t('tip.p.line1', { i: '$' + (it.price.in ?? '-'), o: '$' + (it.price.out ?? '-') })],
      ['', t('tip.p.line2', { c: '$' + (it.price.cr ?? '-'), w: '$' + (it.price.cw ?? '-') })],
    );
    tip.innerHTML =
      '<div class="t-name">' + esc(it.name) + '</div>' +
      '<div class="t-grid">' + lines.map(([k, v, warn]) =>
        '<span class="k">' + k + '</span><span class="v' + (warn ? ' warn' : '') + '">' + v + '</span>').join('') + '</div>';
    tip.classList.remove('hidden');
    // 相对视口定位，避免溢出
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = e.clientX + 14, top = e.clientY + 14;
    if (left + tw > window.innerWidth) left = e.clientX - tw - 14;
    if (top + th > window.innerHeight) top = e.clientY - th - 14;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  });
  row.addEventListener('mouseleave', () => $('#tip').classList.add('hidden'));
}

// 明细表
function renderDetailTable(items) {
  const t2 = $('#detail-table');
  const cols = ['dt.model', 'dt.quota', 'dt.in', 'dt.out', 'dt.cr', 'dt.cw', 'dt.cost', 'dt.est', 'dt.off', 'dt.diff'];
  const head = '<tr>' + cols.map((c) => '<th>' + t(c) + '</th>').join('') + '</tr>';
  const body = items.map((it) => {
    const diff = it.diff == null ? '—' : (it.diff * 100).toFixed(1) + '%';
    return '<tr><td>' + esc(it.name) + '</td>' +
      '<td>$' + (it.quota ?? '-') + '</td>' +
      '<td>' + (it.price.in ?? '-') + '</td>' +
      '<td>' + (it.price.out ?? '-') + '</td>' +
      '<td>' + (it.price.cr ?? '-') + '</td>' +
      '<td>' + (it.price.cw ?? '-') + '</td>' +
      '<td>' + (it.cost != null ? it.cost.toFixed(6) : '-') + '</td>' +
      '<td>' + (it.monthly != null ? fmt(Math.round(it.monthly)) : 'N/A') + '</td>' +
      '<td>' + (it.officialMonthly != null ? fmt(it.officialMonthly) : '-') + '</td>' +
      '<td>' + diff + '</td></tr>';
  }).join('');
  t2.innerHTML = head + body;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ========== 主流程 ==========
function showError(msg) {
  const el = $('#error');
  el.style.display = 'block';
  el.textContent = t('err.fetch', { msg });
}

async function load() {
  $('#refresh').disabled = true;
  const hasCache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
  if (hasCache) {
    render(hasCache);
    setMeta('meta.cache', { time: hasCache.time });
  }
  try {
    const mdx = await fetchMdx();
    const data = parse(mdx);
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    render(data);
    setMeta('meta.ok', { time: data.time, n: data.items.length });
    $('#error').style.display = 'none';
  } catch (e) {
    if (!hasCache) {
      showError(e.message);
      setMeta('meta.wait', {});
    } else {
      setMeta('meta.fallback', { msg: e.message });
    }
  } finally {
    $('#refresh').disabled = false;
  }
}

// ========== 初始化 ==========
applyLang();
$('#refresh').addEventListener('click', load);
// 语言切换按钮：更新记忆并整页重画
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
  LANG = b.dataset.lang;
  localStorage.setItem('ocgl-lang', LANG);
  applyLang();
}));
load();
</script>
<script defer src="/api/stats/t.js"></script>
